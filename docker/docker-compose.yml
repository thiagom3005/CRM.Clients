services:
  api:
    build:
      context: ..
      dockerfile: src/CRM.Clients.Api/Dockerfile
    container_name: crm-clients-api
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # Configuracao via variavel de ambiente usando separador __ (padrao ASP.NET Core).
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=crm_clients;Username=crm_user;Password=crm_pass
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - crm-clients-network

  postgres:
    image: postgres:16-alpine
    container_name: crm-clients-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: crm_clients
      POSTGRES_USER: crm_user
      POSTGRES_PASSWORD: crm_pass
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm_user -d crm_clients"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - crm-clients-postgres-data:/var/lib/postgresql/data
    networks:
      - crm-clients-network

networks:
  crm-clients-network:
    driver: bridge

volumes:
  crm-clients-postgres-data: